<!--
  motto swatch 06 · design-refresh §4 (plans/design-refresh.md)

  Brian is choosing where the motto goes. The direction is the sublimare
  family; finalists SOLVE ET SUBLIMA and SUBLIMATE. Two placements, the
  two most different, each shown with both texts on both grounds:

    A — the seal legend: the motto encircles the device, the way a
        printer's mark or a wax seal carries its legend. Completes the
        emblem grammar (pictura + motto + subscriptio) on the About plate.
        Note: a long motto fills the ring; a one-word motto sits sparse.
    B — a static engraved plate: the motto on a quiet ruled band, a
        tailpiece the plan already sanctioned ('engraved, not performed').

  Legend set in EB Garamond caps (engraved Roman capitals); plate in
  Literata italic (the author's book voice). Open directly, no build.
-->

  .night {
    --bg: #121212; --ink: #dbd7ca; --ink-muted: #a49e91; --ink-faint: #78736a;
    --rubric: #a84a2c; --w-ink: #c9b899; --w-muted: #9a8b6e; --w-faint: #6f6654;
    --hairline: rgba(219,215,202,0.10); --hairline-strong: rgba(219,215,202,0.16);
  }
  body { background: #333; }
  section { background: var(--bg); color: var(--ink); padding: 2.5rem 2rem 3.5rem; }
  h2 {
    font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.16em; color: var(--ink-muted);
    margin-bottom: 1.5rem; padding-bottom: 0.6rem; box-shadow: inset 0 -1px 0 var(--hairline-strong);
  }
  h3 { font-family: 'Geist Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin: 2rem 0 0.4rem; }
  .row { display: flex; flex-wrap: wrap; gap: 3rem; align-items: flex-start; }
  figure { text-align: center; }
  figcaption { font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; color: var(--ink-faint); padding-top: 6px; }

  .seal-legend text { fill: var(--w-muted); }
  .seal-legend .device {
    fill: var(--w-ink);
  }
  .plate {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    color: var(--w-muted);
    font-family: 'Literata', serif; font-style: italic; font-size: 17px; letter-spacing: 0.02em;
  }
  .plate .prick { color: var(--w-faint); font-style: normal; }
  .plate.ruled { box-shadow: inset 0 0 0 1px var(--hairline-strong); }
  .plate.caps {
    font-family: 'EB Garamond', serif; font-style: normal;
    text-transform: uppercase; letter-spacing: 0.22em; font-size: 14px;
  }
</style>
